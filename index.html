<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple CSS Waves</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!--Hey! This is the original version
of Simple CSS Waves-->

<div class="header">

<!--Top navigation bar-->
<nav class="topnav">
  <div class="nav-links">
    <a href="#profile">Profile</a>
    <a href="#chat">Chat</a>
    <a href="#groups">Groups</a>
    <a href="#challenges">Weekly Challenges</a>
    <a href="#notifications" class="nav-notif">Notifications<span class="notif-dot"></span></a>
  </div>
  <div class="nav-search">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search / filter" aria-label="Search or filter" />
  </div>
</nav>
<!--Top navigation bar ends-->

<!--Content before waves-->
<div class="inner-header flex">
<!--Just the logo.. Don't mind this-->
<svg version="1.1" class="logo" baseProfile="tiny" id="Layer_1" xmlns="http://www.w3.org/2000/svg"
xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 500 500" xml:space="preserve">
<path fill="#FFFFFF" stroke="#000000" stroke-width="10" stroke-miterlimit="10" d="M57,283" />
<g><path fill="#fff"
d="M250.4,0.8C112.7,0.8,1,112.4,1,250.2c0,137.7,111.7,249.4,249.4,249.4c137.7,0,249.4-111.7,249.4-249.4
C499.8,112.4,388.1,0.8,250.4,0.8z M383.8,326.3c-62,0-101.4-14.1-117.6-46.3c-17.1-34.1-2.3-75.4,13.2-104.1
c-22.4,3-38.4,9.2-47.8,18.3c-11.2,10.9-13.6,26.7-16.3,45c-3.1,20.8-6.6,44.4-25.3,62.4c-19.8,19.1-51.6,26.9-100.2,24.6l1.8-39.7		c35.9,1.6,59.7-2.9,70.8-13.6c8.9-8.6,11.1-22.9,13.5-39.6c6.3-42,14.8-99.4,141.4-99.4h41L333,166c-12.6,16-45.4,68.2-31.2,96.2	c9.2,18.3,41.5,25.6,91.2,24.2l1.1,39.8C390.5,326.2,387.1,326.3,383.8,326.3z" />
</g>
</svg>
<h1>Simple CSS Waves</h1>
</div>

<!--Waves Container-->
<div>
<svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
<defs>
<path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
</defs>
<g class="parallax">
<use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
<use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
<use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
<use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
</g>
</svg>
</div>
<!--Waves end-->

<!--Floating album covers-->
<div class="ocean-floaters">
  <button class="floater floater-1" type="button" data-title="Blooming of Me" data-artist="Artist Name" aria-label="Play Blooming of Me by Artist Name">
    <img src="cover1.png" alt="Blooming of Me cover art">
  </button>
  <button class="floater floater-2" type="button" data-title="Flower" data-artist="Artist Name" aria-label="Play Flower by Artist Name">
    <img src="cover2.png" alt="Flower cover art">
  </button>
  <button class="floater floater-3" type="button" data-title="Peace of Mind" data-artist="Jake Doe" aria-label="Play Peace of Mind by Jake Doe">
    <img src="cover3.png" alt="Peace of Mind cover art">
  </button>
</div>
<!--Floating album covers end-->

</div>
<!--Header ends-->

<!--Content starts-->
<div class="content flex">
  <p>By.Goodkatz | Free to use </p>
</div>
<!--Content ends-->

<!--Nav section panel-->
<div class="nav-panel-backdrop" id="navPanelBackdrop"></div>
<div class="nav-panel" id="navPanel" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="nav-panel-header">
    <span id="navPanelTitle" class="nav-panel-title"></span>
    <button class="nav-panel-close" id="navPanelClose" type="button" aria-label="Close panel">&times;</button>
  </div>
  <div class="nav-panel-body"></div>
</div>
<!--Nav section panel end-->

<!--Bottom player bar-->
<div class="player-bar" id="playerBar" aria-hidden="true">
  <div class="player-progress"><div class="player-progress-fill" id="progressFill"></div></div>
  <div class="player-track">
    <img id="playerCover" src="" alt="">
    <div class="player-meta">
      <span id="playerTitle" class="player-title">Title</span>
      <span id="playerArtist" class="player-artist">Artist</span>
    </div>
  </div>
  <button id="playPauseBtn" class="play-pause-btn" type="button" aria-label="Play">
    <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <button id="endSongBtn" class="end-song-btn" type="button">End Song</button>
  <button id="playerClose" class="player-close" type="button" aria-label="Close player">&times;</button>
</div>
<!--Bottom player bar ends-->

<script>
(function () {
  var floaters = document.querySelectorAll('.floater');
  var playerBar = document.getElementById('playerBar');
  var playerCover = document.getElementById('playerCover');
  var playerTitle = document.getElementById('playerTitle');
  var playerArtist = document.getElementById('playerArtist');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var playerClose = document.getElementById('playerClose');
  var iconPlay = playPauseBtn.querySelector('.icon-play');
  var iconPause = playPauseBtn.querySelector('.icon-pause');

  var activeFloater = null;

  function setPlaying(isPlaying) {
    playerBar.classList.toggle('playing', isPlaying);
    iconPlay.hidden = isPlaying;
    iconPause.hidden = !isPlaying;
    playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  function openPlayer(floater) {
    if (activeFloater && activeFloater !== floater) {
      activeFloater.classList.remove('active');
    }
    activeFloater = floater;
    floater.classList.add('active');

    var img = floater.querySelector('img');
    playerCover.src = img.getAttribute('src');
    playerCover.alt = img.getAttribute('alt');
    playerTitle.textContent = floater.dataset.title;
    playerArtist.textContent = floater.dataset.artist;

    playerBar.classList.add('open');
    playerBar.setAttribute('aria-hidden', 'false');
    setPlaying(true);
  }

  function closePlayer() {
    playerBar.classList.remove('open');
    playerBar.setAttribute('aria-hidden', 'true');
    setPlaying(false);
    if (activeFloater) {
      activeFloater.classList.remove('active');
      activeFloater = null;
    }
  }

  floaters.forEach(function (floater) {
    floater.addEventListener('click', function () {
      if (activeFloater === floater && playerBar.classList.contains('open')) {
        setPlaying(!playerBar.classList.contains('playing'));
      } else {
        openPlayer(floater);
      }
    });
  });

  playPauseBtn.addEventListener('click', function () {
    setPlaying(!playerBar.classList.contains('playing'));
  });

  playerClose.addEventListener('click', closePlayer);

  var endSongBtn = document.getElementById('endSongBtn');
  endSongBtn.addEventListener('click', function () {
    if (!activeFloater) return;
    var floaterToRemove = activeFloater;

    // Hide the player bar, the song has ended
    playerBar.classList.remove('open');
    playerBar.setAttribute('aria-hidden', 'true');
    setPlaying(false);
    activeFloater = null;

    // Sink the cover down and fade it out, then remove it from the screen
    floaterToRemove.classList.add('sinking');
    window.setTimeout(function () {
      if (floaterToRemove.parentNode) {
        floaterToRemove.parentNode.removeChild(floaterToRemove);
      }
    }, 5000);
  });

  // Nav section panel
  var navLinks = document.querySelectorAll('.nav-links a');
  var navPanel = document.getElementById('navPanel');
  var navPanelBackdrop = document.getElementById('navPanelBackdrop');
  var navPanelTitle = document.getElementById('navPanelTitle');
  var navPanelClose = document.getElementById('navPanelClose');

  function openNavPanel(label) {
    navPanelTitle.textContent = label;
    navPanel.classList.add('open');
    navPanel.setAttribute('aria-hidden', 'false');
    navPanelBackdrop.classList.add('open');
  }

  function closeNavPanel() {
    navPanel.classList.remove('open');
    navPanel.setAttribute('aria-hidden', 'true');
    navPanelBackdrop.classList.remove('open');
  }

  navLinks.forEach(function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      openNavPanel(link.textContent.trim());
    });
  });

  navPanelClose.addEventListener('click', closeNavPanel);
  navPanelBackdrop.addEventListener('click', closeNavPanel);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeNavPanel();
    }
  });

  // Search / filter: only show covers whose song title or artist matches
  var searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', function () {
    var query = searchInput.value.trim().toLowerCase();
    floaters.forEach(function (floater) {
      var title = floater.dataset.title.toLowerCase();
      var artist = floater.dataset.artist.toLowerCase();
      var matches = query === '' || title.indexOf(query) !== -1 || artist.indexOf(query) !== -1;
      floater.classList.toggle('hidden', !matches);
    });
  });
})();
</script>

</body>
</html>
